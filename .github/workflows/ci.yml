name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # BuildKonfig reads API_KEY from local.properties at configuration time
      # and fails the build if the file is absent.
      - name: Generate local.properties
        run: echo "API_KEY=${{ secrets.API_KEY }}" > local.properties

      - name: Run tests and coverage
        run: ./gradlew testAndroidHostTest koverXmlReport koverHtmlReport

      # Single aggregated coverage report for all modules (open html/index.html)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/**

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate local.properties
        run: echo "API_KEY=${{ secrets.API_KEY }}" > local.properties

      # google-services.json is gitignored: it is restored from a repository secret.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

      - name: Assemble debug APK and lint
        run: ./gradlew :androidApp:assembleDebug :androidApp:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: androidApp/build/reports/lint-results-debug.html

  ios:
    name: iOS framework build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate local.properties
        run: echo "API_KEY=${{ secrets.API_KEY }}" > local.properties

      - name: Link iOS simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
